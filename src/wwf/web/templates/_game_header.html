<section class="card game-header">
  <div class="game-title">
    <h1>{{ game.name }}</h1>
    <details class="rename">
      <summary class="small">Rename</summary>
      <form action="/game/{{ game.id }}/rename" method="post" class="inline-form">
        <input name="name" value="{{ game.name }}" maxlength="60" required aria-label="Game name">
        <button type="submit">Save</button>
      </form>
    </details>
  </div>
  <div class="scoreboard" aria-label="Score">
    <div class="score"><span class="who">You</span><span class="pts">{{ scores.me }}</span></div>
    <div class="score"><span class="who">Opponent</span><span class="pts">{{ scores.opponent }}</span></div>
    {% if bag %}<div class="score"><span class="who">In bag</span><span class="pts">{{ bag.in_bag }}</span></div>{% endif %}
  </div>
  <ol class="stepper" aria-label="Where this turn is">
    <li class="{{ 'now' if step == 1 else 'done' if step > 1 }}">Solve</li>
    <li class="{{ 'now' if step == 2 else 'done' if step > 2 }}">Play a move</li>
    <li class="{{ 'now' if step == 3 }}">Opponent</li>
  </ol>
  <p class="small hint">Points count turns logged here{% if not game.turns %}; none yet{% endif %}.</p>
</section>
